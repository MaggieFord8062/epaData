{% extends "base.html" %}

{% block title %}Rankings - epaData{% endblock %}

{% block content %}

<div class="page-head">
    <h1>Rankings</h1>
    <p>Find the biggest or smallest emitters. Facility rankings add up every unit at the plant.</p>
</div>

<form class="panel" method="POST">

    <div class="segmented" role="radiogroup" aria-label="Rank">
        <input type="radio" id="type-facility" name="type" value="Facility" checked>
        <label for="type-facility">Facilities</label>
        <input type="radio" id="type-unit" name="type" value="Unit">
        <label for="type-unit">Units</label>
    </div>

    <div class="rank-sentence" style="margin-top: 26px;">
        <span>Show the</span>
        <select class="control" name="order" aria-label="Order">
            <option value="DESC">top</option>
            <option value="ASC">bottom</option>
        </select>
        <select class="control" name="limit" aria-label="How many">
            {% for n in [10, 25, 50, 100] %}
            <option value="{{ n }}">{{ n }}</option>
            {% endfor %}
        </select>
        <span>by</span>
        <select class="control" name="field" aria-label="Rank by">
            {% for value, header in rank_fields.items() %}
            <option value="{{ value }}">{{ header }}</option>
            {% endfor %}
        </select>
    </div>

    <div class="filter-grid" style="margin-top: 28px;">
        <div class="field">
            <label for="state">State</label>
            <select class="control" id="state" name="state">
                <option value="">All states</option>
                {% for s in states %}<option value="{{ s }}">{{ s }}</option>{% endfor %}
            </select>
        </div>
        <div class="field">
            <label for="reporting_year">Reporting year</label>
            <select class="control" id="reporting_year" name="reporting_year">
                <option value="">All years</option>
                {% for y in years %}<option value="{{ y }}">{{ y }}</option>{% endfor %}
            </select>
        </div>
        <div class="field">
            <label for="unit_type">Unit type</label>
            <select class="control" id="unit_type" name="unit_type">
                <option value="">All unit types</option>
                {% for u in unit_types %}<option value="{{ u }}">{{ u }}</option>{% endfor %}
            </select>
        </div>
        <div class="field">
            <label for="primary_fuel">Primary fuel</label>
            <select class="control" id="primary_fuel" name="primary_fuel">
                <option value="">All fuels</option>
                {% for f in primary_fuels %}<option value="{{ f }}">{{ f }}</option>{% endfor %}
            </select>
        </div>
    </div>

    <p style="margin: 28px 0 0;">
        <button class="btn btn-primary" type="submit">Show ranking</button>
    </p>
</form>

{% endblock %}
