<!DOCTYPE html>
<html>
<head>
    <title>Advanced Search - epaData</title>
</head>

<body>

    <h1>Advanced Search</h1>

    <form method="POST">

        <h2>Type</h2>

        <select name="type" onchange="updateFields()">
            <option value="">-- Select type --</option>
            <option value="Facility">Facility</option>
            <option value="Unit">Unit</option>
            <option value="Annual Record">Annual Record</option>
        </select>

        <div id="type_inputs"></div>

        <br><br>

        <label>Order:</label>
        <select name="order">
            <option value="DESC">Descending</option>
            <option value="ASC">Ascending</option>
        </select>

        <br><br>

        <label>Limit:</label>
        <input type="text" name="limit">

        <br><br>

        <button type="submit">Search</button>

    </form>

    <p>
        <a href="/search">Back to Search Data</a>
    </p>

    <script>

    function updateFields() {
        const type = document.querySelector('select[name="type"]').value;
        const container = document.getElementById("type_inputs");

        if (type === "Facility") {
            container.innerHTML = `
                <h3>Facility Fields</h3>

                <label>State:</label>
                <input type="text" name="state">

                <br><br>

                <label>County:</label>
                <input type="text" name="county">

                <br><br>

                <label>Source Category:</label>
                <input type="text" name="source_category">

                <br><br>

                <label>Rank By:</label>
                <select name="field">
                    <option value="">-- Select field --</option>
                    <option value="co2_mass">CO2</option>
                    <option value="so2_mass">SO2</option>
                    <option value="nox_mass">NOx</option>
                </select>
            `;
        }

        else if (type === "Unit") {
            container.innerHTML = `
                <h3>Unit Fields</h3>

                <label>Unit Type:</label>
                <input type="text" name="unit_type">

                <br><br>

                <label>Primary Fuel:</label>
                <input type="text" name="primary_fuel">

                <br><br>

                <label>Secondary Fuel:</label>
                <input type="text" name="secondary_fuel">

                <br><br>

                <label>State:</label>
                <input type="text" name="state">

                <br><br>

                <label>County:</label>
                <input type="text" name="county">

                <br><br>

                <label>Source Category:</label>
                <input type="text" name="source_category">

                <br><br>

                <label>Rank By:</label>
                <select name="field">
                    <option value="">-- Select field --</option>
                    <option value="co2_mass">CO2</option>
                    <option value="so2_mass">SO2</option>
                    <option value="nox_mass">NOx</option>
                    <option value="gross_load">Gross Load</option>
                    <option value="heat_input">Heat Input</option>
                </select>
            `;
        }

        else if (type === "Annual Record") {
            container.innerHTML = `
                <h3>Annual Record Fields</h3>

                <label>Reporting Year:</label>
                <input type="text" name="reporting_year">

                <br><br>

                <label>Operating Time:</label>
                <input type="text" name="operating_time">

                <br><br>

                <label>Gross Load:</label>
                <input type="text" name="gross_load">

                <br><br>

                <label>Heat Input:</label>
                <input type="text" name="heat_input">

                <br><br>

                <label>CO2 Mass:</label>
                <input type="text" name="co2_mass">

                <br><br>

                <label>SO2 Mass:</label>
                <input type="text" name="so2_mass">

                <br><br>

                <label>NOx Mass:</label>
                <input type="text" name="nox_mass">

                <br><br>

                <label>Rank By:</label>
                <select name="field">
                    <option value="">-- Select field --</option>
                    <option value="co2_mass">CO2</option>
                    <option value="so2_mass">SO2</option>
                    <option value="nox_mass">NOx</option>
                </select>
            `;
        }

        else {
            container.innerHTML = "";
        }
    }
    </script>


</body>
</html>
