<!DOCTYPE html>
<html>
<head><title>epaData</title></head>
<body>
    <h1>epaData: EPA Power-Sector Emissions Data</h1>
    <p>Current data coverage:</p>
    <ul>
        <li>Facilities: {{ facility_count }}</li>
        <li>Units: {{ unit_count }}</li>
        <li>Annual records: {{ record_count }}</li>
        <li>States covered: {{ states }}</li>
        <li>Datasets retrieved: {{ dataset_count }}</li>
    </ul>

    <a href="/search" style="margin-right: 20px;">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="vertical-align: middle; margin-right: 6px;">
            <circle cx="11" cy="11" r="7"></circle>
            <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
        </svg>
        Search Data
    </a>

    <a href="/explorer">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="vertical-align: middle; margin-right: 6px;">
            <rect x="3" y="3" width="7" height="7"></rect>
            <rect x="14" y="3" width="7" height="7"></rect>
            <rect x="14" y="14" width="7" height="7"></rect>
            <rect x="3" y="14" width="7" height="7"></rect>
        </svg>
        View Data Explorer
    </a>
</body>
</html>
